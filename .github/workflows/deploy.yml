name: Deploy to Railway

# Every merge to master deploys, so a merged pull request is live without
# anyone running the CLI by hand.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          # A project token (Project Settings -> Tokens) works on its own.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # An account token (Account Settings -> Tokens) needs the project named.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJECT_ID: d6606a59-8377-4e24-a855-4fe25519c159
          SERVICE: alfredo_admin
        run: |
          set -e
          TOKEN="${RAILWAY_TOKEN:-$RAILWAY_API_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No Railway token found. Add RAILWAY_TOKEN under" \
                 "Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

          # Railway issues two kinds of token and they are used differently:
          # a project token authenticates on its own, an account token has to
          # name the project. Rather than depending on which one was pasted in,
          # try it as a project token and fall back to the account-token flow.
          echo "Trying the token as a project token..."
          if RAILWAY_TOKEN="$TOKEN" railway up --service "$SERVICE" --detach; then
            exit 0
          fi

          echo "That failed; trying it as an account token instead..."
          unset RAILWAY_TOKEN
          export RAILWAY_API_TOKEN="$TOKEN"
          railway link --project "$PROJECT_ID" --environment production --service "$SERVICE"
          railway up --service "$SERVICE" --detach
