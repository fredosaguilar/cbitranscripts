name: Deploy to Railway

# Every merge to master deploys, so a merged pull request is live without
# anyone running the CLI by hand.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          # A project token (Project Settings -> Tokens) works on its own.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # An account token (Account Settings -> Tokens) needs the project named.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PROJECT_ID: d6606a59-8377-4e24-a855-4fe25519c159
          SERVICE: alfredo_admin
        run: |
          set -e
          if [ -n "$RAILWAY_API_TOKEN" ]; then
            echo "Using an account token; linking to the project first."
            unset RAILWAY_TOKEN
            railway link --project "$PROJECT_ID" --environment production --service "$SERVICE"
          elif [ -n "$RAILWAY_TOKEN" ]; then
            echo "Using a project token."
          else
            echo "No Railway token found. Add RAILWAY_TOKEN (project token) or" \
                 "RAILWAY_API_TOKEN (account token) under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          railway up --service "$SERVICE" --detach
