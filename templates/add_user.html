{% extends "base.html" %}

{% block title %}Add User{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/add_user.css">
{% endblock %}

{% block content %}

<h2>Add User</h2>

<div class="form-container surface">
    <form method="post" action="/admin/add-user">

        <label>User ID (RingCentral extension number)</label>
        <input type="text" name="user_id" placeholder="e.g. 101"
               value="{{ request.query_params.get('user_id', '') }}" required>
        <small style="display:block; margin:-6px 0 12px; opacity:0.8;">
            Calls answered on this extension are assigned to this user automatically.
        </small>

        <label>Email</label>
        <input type="email" name="email" placeholder="name@columbiabasininsurance.com">
        <small style="display:block; margin:-6px 0 12px; opacity:0.8;">
            Emailed to review each call assigned to this extension.
        </small>

        <label>User Token (Pushover key, optional)</label>
        <input type="text" name="user_token" placeholder="Leave blank if not using push notifications">

        <button type="submit">Add User</button>
    </form>
</div>

{% endblock %}
